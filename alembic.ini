# Alembic configuration file — NutriOS
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Prepend backend/ to sys.path so "from app.xxx import ..." works
prepend_sys_path = .

# Separator used in version file names
version_path_separator = os

# sqlalchemy.url is overridden at runtime by env.py (reads DATABASE_URL from
# app.config.settings), so this is just a safe fallback for alembic CLI.
sqlalchemy.url = %(DATABASE_URL)s


# ── Logging ───────────────────────────────────────────────────
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
